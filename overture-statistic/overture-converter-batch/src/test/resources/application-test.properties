## S3 client configuration for tests
# --- Spring Batch ---
spring.batch.job.enabled=false

# --- S3 client config (region/creds used by the @Primary S3Client bean in test) ---

s3.region=us-west-2
s3.endpoint=https://s3.amazonaws.com
s3.access-key=minioadmin
s3.secret-key=minioadmin

batch.jobs.enabledJobs=LandJob
batch.jobs.parameters.LandJob.version=e2e-version

batch.jobs.inputBasePath=test-base-path
batch.jobs.dataVersion=test-version
