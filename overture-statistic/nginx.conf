worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    upstream elasticsearch {
        server es01:9200;
        keepalive 128;
    }

    keepalive_timeout 65s;
    keepalive_requests 1000;

    server {
        listen 9201;  # Listen for HTTP requests on port 9101
        client_max_body_size 100M;

        location / {
            # Forward requests to Elasticsearch over HTTPS
            proxy_pass https://elasticsearch;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Specify the CA certificate to verify Elasticsearch's SSL certificate
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca/ca.crt;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_ciphers HIGH:!aNULL:!MD5;
            proxy_ssl_verify off;
        }
    }
}
